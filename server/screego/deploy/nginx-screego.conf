map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 5050 ssl;
    server_name _;

    ssl_certificate     /etc/gamecast-sfu/tls/current/cert.pem;
    ssl_certificate_key /etc/gamecast-sfu/tls/current/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location = /inject.js {
        alias /var/www/screego/inject.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /webrtc-stats.js {
        alias /var/www/screego/webrtc-stats.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /webrtc-quality.js {
        alias /var/www/screego/webrtc-quality.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /webrtc-adaptive.js {
        alias /var/www/screego/webrtc-adaptive.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /web-share-audio.js {
        alias /var/www/screego/web-share-audio.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /sfu-client.js {
        alias /var/www/screego/sfu-client.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /partylan-web.webp {
        alias /var/www/screego/partylan-web.webp;
        types { }
        default_type image/webp;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /partylan-favicon.png {
        alias /var/www/screego/partylan-favicon.png;
        types { }
        default_type image/png;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /partylan-apple-touch.png {
        alias /var/www/screego/partylan-apple-touch.png;
        types { }
        default_type image/png;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /appicon-web.webp {
        alias /var/www/screego/partylan-web.webp;
        types { }
        default_type image/webp;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /appicon.png {
        alias /var/www/screego/partylan-web.webp;
        types { }
        default_type image/webp;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /logo.svg {
        alias /var/www/screego/partylan-web.webp;
        types { }
        default_type image/webp;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /favicon.ico {
        alias /var/www/screego/partylan-favicon.png;
        types { }
        default_type image/png;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /apple-touch-icon.png {
        alias /var/www/screego/partylan-apple-touch.png;
        types { }
        default_type image/png;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /og-banner.png {
        alias /var/www/screego/partylan-web.webp;
        types { }
        default_type image/webp;
        add_header Cache-Control "public, max-age=604800";
    }

    location /api/register {
        proxy_pass http://127.0.0.1:5052;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/history {
        proxy_pass http://127.0.0.1:5052;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/stats {
        proxy_pass http://127.0.0.1:5052;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/rooms {
        proxy_pass http://127.0.0.1:5052;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/room-state {
        proxy_pass http://127.0.0.1:5052;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/viewer-intent {
        proxy_pass http://127.0.0.1:5052;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/presence {
        proxy_pass http://127.0.0.1:5052;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/share {
        proxy_pass http://127.0.0.1:5052;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/quality {
        proxy_pass http://127.0.0.1:5052;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/voice {
        proxy_pass http://127.0.0.1:5052;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sfu-ws {
        proxy_pass http://127.0.0.1:5053/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /voice-ws {
        proxy_pass http://127.0.0.1:5054/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /stream {
        proxy_pass http://127.0.0.1:5060;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Origin "";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://127.0.0.1:5060;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";

        add_header Cache-Control "no-cache, no-store, must-revalidate";

        sub_filter '</head>' '<script src="/webrtc-stats.js?v=8"></script><script src="/webrtc-quality.js?v=2"></script><script src="/webrtc-adaptive.js?v=11"></script><script src="/web-share-audio.js?v=4"></script><script src="/inject.js?v=6.43"></script><script src="/sfu-client.js?v=1.11"></script></head>';
        sub_filter 'Screego requires JavaScript' '需要启用 JavaScript';
        sub_filter_once off;
    }
}
