services:
  screego:
    image: gamecast-sfu:registration-hot-reload-v1
    container_name: screego
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ${SCREEGO_USERS_DIR_HOST:-/etc/gamecast-sfu/users}:/app/users:ro
    environment:
      SCREEGO_AUTH_MODE: "all"
      SCREEGO_USERS_FILE: /app/users/users.htpasswd
      SCREEGO_EXTERNAL_IP: "${SCREEGO_EXTERNAL_IP}"
      SCREEGO_TURN_PORT_RANGE: "50000:50200"
      SCREEGO_SECRET: "${SCREEGO_SECRET}"
      SCREEGO_FORCE_RELAY: "false"
      SCREEGO_SERVER_ADDRESS: ":5060"
    command: ["serve"]
